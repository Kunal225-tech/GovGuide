services:
  # ============================================================================
  # 1. GovGuide Node.js / Express Backend REST API
  # ============================================================================
  - type: web
    name: govguide-backend
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false

  # ============================================================================
  # 2. GovGuide Python / FastAPI AI Microservice (RAG + Demographic NLP)
  # ============================================================================
  - type: web
    name: govguide-ai
    runtime: python
    rootDir: ai-services
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: QDRANT_COLLECTION
        value: govguide_schemes
      - key: GEMINI_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: INGEST_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false

